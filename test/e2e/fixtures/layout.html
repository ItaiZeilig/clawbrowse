<!doctype html><html><head><meta charset="utf-8"><title>Layout</title>
<style>body{margin:0;font:14px sans-serif} header{position:sticky;top:0;height:60px;background:#eee;z-index:5}
 .row{display:flex;flex-direction:row-reverse;gap:10px} #box{height:120px;overflow:auto;border:1px solid}</style></head><body>
<header><button onclick="o('menu')">Menu</button></header>
<div class="row"><span>FIRST-VISUAL-RIGHT</span><span>SECOND-VISUAL-LEFT</span></div>
<button onclick="o('top')">Top button</button>
<div id="box"><div style="height:300px"></div><button onclick="o('inbox')">Inside scroll box</button></div>
<div style="height:1500px"></div>
<button id="below" onclick="o('below')">Far below button</button>
<div style="height:300px"></div>
<p id="out"></p>
<dialog id="dlg"><p>Are you sure?</p><button onclick="document.getElementById('dlg').close();o('confirmed')">Confirm</button></dialog>
<button onclick="document.getElementById('dlg').showModal()" style="position:fixed;bottom:10px;right:10px">Open dialog</button>
<script>function o(s){document.getElementById('out').textContent=s}</script>
</body></html>
