name: Publish to npm

# Token-free publishing via npm Trusted Publishing (OIDC).
# Fires when you publish a GitHub Release. No NPM_TOKEN / secrets needed —
# npm verifies this workflow's OIDC identity against the trusted publisher
# configured on the package (npmjs.com -> pawbrowse -> Settings -> Trusted Publishers).
#
# One-time setup on npmjs.com (Trusted Publishers -> add GitHub Actions):
#   Organization or user: ItaiZeilig
#   Repository:           pawbrowse
#   Workflow filename:    release.yml
#   Environment:          (leave blank)

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write   # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22          # OIDC needs Node >= 22.14.0
          registry-url: https://registry.npmjs.org

      - name: Ensure npm >= 11.5.1 (required for OIDC trusted publishing)
        run: npm install -g npm@latest

      - name: Verify package version matches the release tag
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "package.json version ($PKG_VERSION) != release tag ($TAG)" >&2
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Publish (OIDC, with provenance)
        run: npm publish --provenance --access public
